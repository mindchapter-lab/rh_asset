name: Weekly maintenance snapshot

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays, 11:00 UTC (6-7 a.m. Eastern)
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record counts
        run: python3 scripts/snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "maintenance-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
